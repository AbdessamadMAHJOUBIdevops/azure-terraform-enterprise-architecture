<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Demo - Web App</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e1e1e, #000000); color: white; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .container { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.18); max-width: 600px; }
        h1 { color: #00d2ff; font-size: 2.5em; margin-bottom: 10px; }
        p { font-size: 1.2em; line-height: 1.6; color: #cccccc; }
        .badge { display: inline-block; background: #00d2ff; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-top: 20px; }
        .tech-stack { margin-top: 30px; display: flex; justify-content: space-around; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Déploiement Réussi !</h1>
        <p>Cette infrastructure Azure a été provisionnée avec <b>Terraform</b> et cette application a été configurée et déployée de manière 100% automatisée via <b>Ansible</b>.</p>
        <div class="badge">GitOps Ready</div>
        <div class="tech-stack">
            <span>🟢 Nginx</span>
            <span>🔵 Azure</span>
            <span>🟣 Terraform</span>
            <span>🔴 Ansible</span>
        </div>
    </div>
</body>
</html>
